name: Aloft client preview

on:
  push:
    branches: [aloft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aloft-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'
  GO_VERSION: '1.27.1'

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Native test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libsecret-1-dev clang libclang-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
      - name: Resolve dependencies and localizations
        run: |
          curl -fsSL --retry 3 -o core/Clash.Meta/component/ca/ca-certificates.crt https://curl.se/ca/cacert-2026-09-25.pem
          echo 'a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505  core/Clash.Meta/component/ca/ca-certificates.crt' | sha256sum -c -
          flutter pub get
          flutter gen-l10n
      - name: Format custom client files
        run: dart format lib/features/aloft test/features/aloft lib/application.dart lib/views/navigation.dart
      - name: Analyze application
        run: flutter analyze --no-fatal-infos
      - name: Run account and interface checks
        run: |
          cp pubspec.yaml /tmp/aloft-pubspec.yaml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pubspec.yaml')
          s=p.read_text().replace('    setup:\n      build_assets: true','    setup:\n      build_assets: false')
          p.write_text(s)
          PY
          flutter test test/features/aloft test/lint/superellipse_corners_test.dart test/lint/dynamic_message_key_test.dart test/lint/typography_test.dart
          cp /tmp/aloft-pubspec.yaml pubspec.yaml
      - name: Keep resolved sources for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aloft-reviewed-sources
          path: |
            lib/features/aloft
            lib/l10n
            pubspec.lock
  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-24.04
            arch: arm64
          - target: windows
            os: windows-2022
            arch: amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Enable long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: nttld/setup-ndk@v1
        if: matrix.target == 'android'
        with:
          ndk-version: r28c
          link-to-sdk: true
          add-to-path: true
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libsecret-1-dev clang libclang-dev
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          install: mingw-w64-x86_64-gcc
          update: true
          path-type: inherit
      - name: Add compiler to path
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH 'C:\msys64\mingw64\bin'
      - name: Prepare application
        shell: bash
        run: |
          curl -fsSL --retry 3 -o core/Clash.Meta/component/ca/ca-certificates.crt https://curl.se/ca/cacert-2026-09-25.pem
          echo 'a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505  core/Clash.Meta/component/ca/ca-certificates.crt' | sha256sum -c -
          flutter pub get
          flutter gen-l10n
          dart run flutter_launcher_icons
      - name: Build Android preview
        if: matrix.target == 'android'
        run: flutter build apk --debug --target-platform android-arm64
      - name: Package Windows preview
        if: matrix.target == 'windows'
        run: dart tool/package.dart windows --arch amd64
      - name: Upload Android preview
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: AloftCloud-Android-arm64-preview
          path: build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload Windows preview
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: AloftCloud-Windows-x64-preview
          path: dist/*
